<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オートレベル高さ計算</title>
<style>body{font-family:system-ui;background:#0b1016;color:#fff;margin:0}.w{max-width:650px;margin:auto;padding:16px}.c{background:#151d26;padding:16px;border-radius:18px;margin:12px 0}h1{font-size:23px}label{display:block;color:#abc;font-size:13px;margin:8px 0 5px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #405064;background:#0d141c;color:#fff;font-size:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.on{background:#238636}.big{text-align:center;font-size:48px;font-weight:900;color:#79c0ff}.act{text-align:center;font-size:28px;font-weight:900;margin:12px}.fig{background:#fff;color:#111;border-radius:15px;padding:10px}svg{width:100%;height:auto}.note{font-size:12px;color:#abc}</style></head><body><div class="w"><h1>📐 オートレベル 高さ計算</h1>
<div class="c"><label>基準点のスタッフ読み (mm)</label><input id="b" type="number" value="1250" inputmode="decimal"><label>基準から</label><div class="two"><button id="u" class="on">↑ 上げる</button><button id="d">↓ 下げる</button></div><label>何mm？</label><input id="dff" type="number" value="30" inputmode="decimal"></div>
<div class="c"><div style="text-align:center;color:#abc">目標スタッフ読み</div><div class="big"><span id="t">1220</span><small style="font-size:18px"> mm</small></div>
<div class="fig"><svg viewBox="0 0 600 390"><line x1="20" y1="340" x2="580" y2="340" stroke="#555" stroke-width="5"/><rect x="35" y="150" width="105" height="42" rx="10" fill="#f5b82e" stroke="#222" stroke-width="4"/><line x1="85" y1="192" x2="85" y2="315" stroke="#333" stroke-width="7"/><line x1="85" y1="280" x2="50" y2="340" stroke="#333" stroke-width="6"/><line x1="85" y1="280" x2="120" y2="340" stroke="#333" stroke-width="6"/><text x="87" y="135" text-anchor="middle" font-size="18">オートレベル</text><line x1="140" y1="171" x2="505" y2="171" stroke="#e53935" stroke-width="4" stroke-dasharray="10 7"/><text x="315" y="157" text-anchor="middle" fill="#c62828">視準線</text><rect x="505" y="45" width="48" height="295" fill="#fff" stroke="#222" stroke-width="4"/><text x="529" y="30" text-anchor="middle" font-size="18">スタッフ</text><line x1="300" y1="290" x2="575" y2="290" stroke="#777" stroke-width="4"/><text x="290" y="296" text-anchor="end">基準</text><line id="fl" x1="300" y1="245" x2="575" y2="245" stroke="#1683d8" stroke-width="6"/><text id="ft" x="290" y="251" text-anchor="end" fill="#1683d8" font-weight="700">仕上がり</text><text id="ar" x="325" y="272" fill="#1683d8" font-size="20" font-weight="800">↑ 30mm</text></svg></div>
<div id="rule" class="note">↑ 上げるとスタッフの読みは小さくなる</div></div>
<div class="c"><label>現在のスタッフ読み (mm) ※任意</label><input id="cur" type="number" inputmode="decimal" placeholder="例：1232"><div id="act" class="act">現在値を入れると表示</div></div></div>
<script>let m=1,$=x=>document.getElementById(x);function f(){let b=+$('b').value||0,d=Math.abs(+$('dff').value||0),t=b-m*d;$('t').textContent=t;$('u').className=m==1?'on':'';$('d').className=m==-1?'on':'';let y=m==1?245:325;$('fl').setAttribute('y1',y);$('fl').setAttribute('y2',y);$('ft').setAttribute('y',y+6);$('ar').setAttribute('y',m==1?272:314);$('ar').textContent=(m==1?'↑ ':'↓ ')+d+'mm';$('rule').textContent=m==1?'↑ 上げるとスタッフの読みは小さくなる':'↓ 下げるとスタッフの読みは大きくなる';let v=$('cur').value;if(v===''){$('act').textContent='現在値を入れると表示';return}let x=+v-t;$('act').textContent=Math.abs(x)<.01?'✓ 目標ピッタリ':x>0?'↑ あと '+Math.abs(x)+'mm 上げる':'↓ あと '+Math.abs(x)+'mm 下げる'}$('u').onclick=()=>{m=1;f()};$('d').onclick=()=>{m=-1;f()};['b','dff','cur'].forEach(x=>$(x).oninput=f);f()</script></body></html>
