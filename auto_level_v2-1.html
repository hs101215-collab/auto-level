<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オートレベル高さ計算</title>
<style>body{font-family:system-ui;background:#0b1016;color:#fff;margin:0}.w{max-width:650px;margin:auto;padding:16px}.c{background:#151d26;padding:16px;border-radius:18px;margin:12px 0}h1{font-size:23px}label{display:block;color:#abc;font-size:13px;margin:10px 0 5px}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:12px;border:1px solid #405064;background:#0d141c;color:#fff;font-size:20px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.on{background:#238636}.big{text-align:center;font-size:46px;font-weight:900;color:#79c0ff}.act{text-align:center;font-size:27px;font-weight:900;margin:12px}.fig{background:#fff;color:#111;border-radius:15px;padding:10px}svg{width:100%;height:auto}.note{font-size:12px;color:#abc;line-height:1.55}.eq{text-align:center;color:#abc;margin-top:8px}</style></head><body><div class="w"><h1>📐 オートレベル 高さ計算</h1>
<div class="c"><label>基準点のスタッフ読み (mm)</label><input id="b" type="number" value="1250" inputmode="decimal">
<label>基準点の高さ (mm)</label><input id="datum" type="number" value="0" inputmode="decimal"><div class="note">例：基準線を0として、基準点が100mm上なら +100、100mm下なら -100。</div>
<label>求めたい仕上がり高さ (mm)</label><input id="goal" type="number" value="30" inputmode="decimal"><div class="note">基準線=0。+30なら基準線より30mm上、-30なら30mm下。</div></div>
<div class="c"><div style="text-align:center;color:#abc">目標スタッフ読み</div><div class="big"><span id="t"></span><small style="font-size:18px"> mm</small></div><div id="eq" class="eq"></div>
<div class="fig"><svg viewBox="0 0 600 420"><line x1="20" y1="350" x2="580" y2="350" stroke="#555" stroke-width="5"/><rect x="35" y="145" width="105" height="42" rx="10" fill="#f5b82e" stroke="#222" stroke-width="4"/><line x1="85" y1="187" x2="85" y2="325" stroke="#333" stroke-width="7"/><line x1="85" y1="285" x2="50" y2="350" stroke="#333" stroke-width="6"/><line x1="85" y1="285" x2="120" y2="350" stroke="#333" stroke-width="6"/><text x="87" y="130" text-anchor="middle" font-size="18">オートレベル</text><line x1="140" y1="166" x2="505" y2="166" stroke="#e53935" stroke-width="4" stroke-dasharray="10 7"/><text x="315" y="152" text-anchor="middle" fill="#c62828">視準線</text><rect x="505" y="40" width="48" height="310" fill="#fff" stroke="#222" stroke-width="4"/><text x="529" y="27" text-anchor="middle" font-size="18">スタッフ</text>
<line x1="280" y1="285" x2="580" y2="285" stroke="#777" stroke-width="3" stroke-dasharray="8 5"/><text x="270" y="291" text-anchor="end">基準線 0</text>
<line id="bp" x1="300" y1="285" x2="580" y2="285" stroke="#f59e0b" stroke-width="6"/><text id="bt" x="290" y="276" text-anchor="end" fill="#b66b00" font-weight="700">基準点</text>
<line id="gl" x1="300" y1="265" x2="580" y2="265" stroke="#1683d8" stroke-width="6"/><text id="gt" x="290" y="256" text-anchor="end" fill="#1683d8" font-weight="700">仕上がり</text></svg></div>
<div id="rel" class="note"></div></div>
<div class="c"><label>現在のスタッフ読み (mm) ※任意</label><input id="cur" type="number" inputmode="decimal" placeholder="例：1232"><div id="act" class="act">現在値を入れると表示</div></div>
<script>let $=x=>document.getElementById(x),num=x=>Number(x)||0,fmt=x=>Number.isInteger(x)?x:x.toFixed(1);
function y(v){return Math.max(205,Math.min(335,285-v*.35))}
function f(){let b=num($('b').value),d=num($('datum').value),g=num($('goal').value),delta=g-d,t=b-delta;$('t').textContent=fmt(t);$('eq').textContent='基準読み '+fmt(b)+' − 高さ差 ('+fmt(g)+' − '+fmt(d)+') = '+fmt(t)+' mm';
let by=y(d),gy=y(g);$('bp').setAttribute('y1',by);$('bp').setAttribute('y2',by);$('bt').setAttribute('y',by-8);$('bt').textContent='基準点 '+(d>=0?'+':'')+fmt(d);$('gl').setAttribute('y1',gy);$('gl').setAttribute('y2',gy);$('gt').setAttribute('y',gy-8);$('gt').textContent='仕上がり '+(g>=0?'+':'')+fmt(g);
$('rel').textContent=delta>0?'基準点から '+fmt(delta)+'mm 上げる → 読みは小さくなる':delta<0?'基準点から '+fmt(-delta)+'mm 下げる → 読みは大きくなる':'基準点と同じ高さ';
let v=$('cur').value;if(v===''){$('act').textContent='現在値を入れると表示';return}let z=Number(v)-t;$('act').textContent=Math.abs(z)<.01?'✓ 目標ピッタリ':z>0?'↑ あと '+fmt(Math.abs(z))+'mm 上げる':'↓ あと '+fmt(Math.abs(z))+'mm 下げる'}
['b','datum','goal','cur'].forEach(x=>$(x).oninput=f);f()</script></body></html>
